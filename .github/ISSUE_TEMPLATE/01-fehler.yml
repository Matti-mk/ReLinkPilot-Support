name: "🐛 Fehler melden / Report a bug"
description: "Fehler in ReLinkPilot melden / Report a ReLinkPilot bug"
title: "[Fehler/Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Meldung! / Thank you for reporting a problem!

        **Wichtig / Important:** Keine Passwörter, Tokens, persönlichen Daten oder privaten URLs veröffentlichen. / Do not post passwords, tokens, personal data or private URLs.
  - type: input
    id: version
    attributes:
      label: "ReLinkPilot-Version / Extension version"
      description: "Unter chrome://extensions (Entwicklermodus) zu finden / Find it in your extension manager."
      placeholder: "z. B. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: "Browser"
      options:
        - Google Chrome
        - Microsoft Edge
        - Brave
        - Opera
        - Vivaldi
        - Anderer / Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: "Browser-Version / Browser version"
      placeholder: "z. B. Chrome 156"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: "Fehlerbeschreibung / What went wrong?"
      description: "Was funktioniert nicht? / Describe the problem."
      placeholder: "Bitte möglichst konkret beschreiben / Please describe the issue."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Schritte zum Nachstellen / Steps to reproduce"
      placeholder: |
        1. Erweiterung öffnen / Open the extension
        2. ...
        3. Fehler tritt auf / Error occurs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Erwartetes Ergebnis / Expected behavior"
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: "Screenshots / Additional information"
      description: "Bilder hier hineinziehen oder einfügen. Vorher private Angaben unkenntlich machen. / Drag or paste screenshots here; remove sensitive information first."
    validations:
      required: false
